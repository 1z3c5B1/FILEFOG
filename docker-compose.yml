services:
  app:
    build: .
    container_name: neonex-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    # порт наружу не публикуем: к нему идёт только Caddy
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    container_name: neonex-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
